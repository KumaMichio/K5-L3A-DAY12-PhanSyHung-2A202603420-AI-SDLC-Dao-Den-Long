<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a1a; font-family: system-ui, sans-serif; }
    #hud { position: fixed; top: 12px; left: 12px; color: #ffe2b0; font-size: 15px; line-height: 1.6;
           background: rgba(20, 12, 40, .6); padding: 10px 14px; border-radius: 10px; pointer-events: none; min-width: 210px; }
    #hud b { color: #ffb347; }
    #help { position: fixed; bottom: 12px; left: 12px; color: #c9b8e8; font-size: 13px; background: rgba(20,12,40,.5);
            padding: 6px 10px; border-radius: 8px; pointer-events: none; }
    #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
           color: #ffe2b0; background: rgba(10, 6, 24, .55); font-size: 22px; text-align: center; }
    #msg h1 { font-size: 46px; margin: 0 0 8px; color: #ffb347; }
    #toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); color: #ffd28a; font-size: 18px;
             text-shadow: 0 0 8px #000; pointer-events: none; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="toast"></div>
  <div id="help">WASD: đi · Space: nhảy · E: nạp đèn · F: tỏa sáng · ←/→ hoặc kéo chuột: xoay camera · R: chơi lại</div>
  <div id="msg"></div>
  <script type="module" src="/src/web/main.ts"></script>
</body>
</html>
