<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    :root { --text: #F5F1E6; --danger: #FF5A5F; --gold: #F2C14E; --sky: #0E1430; --fog: #1B2350; --panel: rgba(14, 20, 48, .72); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); }
    canvas { display: block; }
    .hidden { display: none !important; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #flames { position: absolute; top: 14px; left: 16px; font-size: 30px; letter-spacing: 4px; color: var(--gold); text-shadow: 0 0 10px #ffb347; }
    #flames .off { color: #4a4f63; text-shadow: none; }
    #clock { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
             background: var(--panel); padding: 4px 16px; border-radius: 10px; }
    #clock.danger, .warn { color: var(--danger); }
    #clock.danger { animation: blink 1s steps(2, start) infinite; }
    body.cb { --danger: #FFFFFF; } /* Ticket-03 §6: UI warnings white + ⚠ */
    #carry { position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); font-size: 14px; opacity: .85; }
    @keyframes blink { to { visibility: hidden; } }
    #topright { position: absolute; top: 14px; right: 16px; text-align: right; font-size: 18px; background: var(--panel); padding: 6px 12px; border-radius: 10px; }
    #topright b { color: var(--gold); font-size: 22px; }
    #bar { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; background: var(--panel); padding: 7px 9px; border-radius: 12px; }
    #bar .cell { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #5B5F6E; }
    #bar .cell.on { background: radial-gradient(circle, #FFF6C2 30%, #FFE58A 70%); border-color: var(--gold); box-shadow: 0 0 8px #FFE58A; }
    #cds { position: absolute; bottom: 16px; right: 16px; display: flex; gap: 10px; }
    .cd { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; text-align: center; line-height: 1.1;
          background: conic-gradient(rgba(242,193,78,.85) var(--p, 100%), rgba(40,44,70,.85) 0); border: 2px solid var(--gold); }
    .cd.cooling { border-color: #5B5F6E; }
    .cd span { background: var(--sky); border-radius: 50%; width: 44px; height: 44px; display: grid; place-items: center; }
    #prompt { position: absolute; bottom: 68px; left: 50%; transform: translateX(-50%); background: var(--panel); padding: 6px 14px; border-radius: 8px; font-size: 18px; border: 1px solid var(--gold); }
    #arrow { position: absolute; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 30px solid var(--gold);
             filter: drop-shadow(0 0 6px #FFB347); transform-origin: 50% 50%; }
    #toast { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); font-size: 19px; color: var(--gold); text-shadow: 0 0 8px #000; }
    #windwarn { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); font-size: 17px; color: #cfe3a0; }
    #fps { position: absolute; top: 74px; right: 16px; font-size: 12px; opacity: .7; }
    #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(14, 20, 48, .78); }
    .card { background: var(--panel); border: 1px solid rgba(242,193,78,.5); border-radius: 16px; padding: 28px 36px; max-width: 560px; width: calc(100% - 64px); text-align: center; }
    .card h1 { color: var(--gold); margin: 0 0 6px; font-size: 40px; }
    .card h2 { margin: 0 0 14px; font-weight: 500; opacity: .85; }
    .card p { line-height: 1.55; }
    .card .quote { font-style: italic; border-left: 3px solid var(--gold); padding-left: 12px; text-align: left; }
    .card button { display: block; width: 100%; margin: 10px 0 0; padding: 11px; font-size: 17px; border-radius: 10px; cursor: pointer;
                   border: 1px solid var(--gold); background: #2a2140; color: var(--text); }
    .card button:hover, .card button:focus { background: #3b2e58; outline: 2px solid var(--gold); }
    .card label { display: flex; justify-content: space-between; gap: 12px; margin: 12px 0; align-items: center; }
    .card .score { font-size: 28px; color: var(--gold); }
    .keys { font-size: 13px; opacity: .8; margin-top: 16px; }
  </style>
</head>
<body>
  <div id="hud" class="hidden">
    <div id="flames"></div>
    <div id="clock">05:00</div>
    <div id="topright"></div>
    <div id="toast"></div>
    <div id="windwarn" class="hidden">🍃 Gió sắp nổi…</div>
    <div id="prompt" class="hidden"></div>
    <div id="arrow" class="hidden"></div>
    <div id="carry"></div>
    <div id="bar"></div>
    <div id="cds">
      <div class="cd" id="cd-dash"><span>Lướt<br>Shift</span></div>
      <div class="cd" id="cd-pulse"><span>Tỏa<br>F</span></div>
    </div>
    <div id="fps"></div>
  </div>
  <div id="screen"></div>
  <script type="module" src="/src/web/main.ts"></script>
</body>
</html>
