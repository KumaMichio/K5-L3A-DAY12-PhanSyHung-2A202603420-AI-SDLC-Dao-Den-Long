<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    /* Ticket-04 §4: every UI text >= 18 px at 1280×720 (1rem = 18px); "Chữ lớn" scales everything ×1.25 */
    html { font-size: 18px; }
    html.large { font-size: 22.5px; }
    :root { --text: #F5F1E6; --danger: #FF5A5F; --gold: #F2C14E; --sky: #0E1430; --fog: #1B2350; --panel: rgba(14, 20, 48, .78); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); }
    body { font-size: 1rem; }
    canvas { display: block; }
    .hidden { display: none !important; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #flames { position: absolute; top: .8rem; left: .9rem; font-size: 1.7rem; letter-spacing: .2rem; color: var(--gold); text-shadow: 0 0 10px #ffb347; }
    #flames .off { color: #4a4f63; text-shadow: none; }
    #clock { position: absolute; top: .7rem; left: 50%; transform: translateX(-50%); font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums;
             background: var(--panel); padding: .2rem .9rem; border-radius: 10px; }
    #clock.danger, .warn { color: var(--danger); }
    #clock.danger { animation: blink 1s steps(2, start) infinite; }
    body.cb { --danger: #FFFFFF; } /* Ticket-03 §6: UI warnings white + ⚠ */
    body.rm *, body.rm *::before { animation: none !important; transition: none !important; } /* reduced motion */
    @keyframes blink { to { visibility: hidden; } }
    #topright { position: absolute; top: .8rem; right: .9rem; text-align: right; font-size: 1rem; background: var(--panel); padding: .35rem .7rem; border-radius: 10px; }
    #topright b { color: var(--gold); font-size: 1.25rem; }
    .sub { font-size: 1rem; opacity: .85; }
    #carry { position: absolute; bottom: 3.4rem; left: 50%; transform: translateX(-50%); font-size: 1rem; }
    #bar { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; background: var(--panel); padding: 7px 9px; border-radius: 12px; }
    #bar .cell { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid #5B5F6E; }
    #bar .cell.on { background: radial-gradient(circle, #FFF6C2 30%, #FFE58A 70%); border-color: var(--gold); box-shadow: 0 0 8px #FFE58A; }
    #cds { position: absolute; bottom: .9rem; right: .9rem; display: flex; gap: .55rem; }
    .cd { width: 3.6rem; height: 3.6rem; border-radius: 50%; display: grid; place-items: center; font-size: 1rem; font-weight: 700; text-align: center; line-height: 1.05;
          background: conic-gradient(rgba(242,193,78,.85) var(--p, 100%), rgba(40,44,70,.85) 0); border: 2px solid var(--gold); }
    .cd.cooling { border-color: #5B5F6E; }
    .cd span { background: var(--sky); border-radius: 50%; width: 3rem; height: 3rem; display: grid; place-items: center; }
    #prompt { position: absolute; bottom: 5.2rem; left: 50%; transform: translateX(-50%); background: var(--panel); padding: .35rem .8rem; border-radius: 8px; font-size: 1.05rem; border: 1px solid var(--gold); }
    #subs { position: absolute; bottom: 7.6rem; left: 50%; transform: translateX(-50%); width: min(90%, 46rem); text-align: center; }
    #subs div { display: inline-block; margin: .15rem 0; padding: .2rem .7rem; background: rgba(0,0,0,.72); border-radius: 6px; font-size: 1.05rem; }
    #arrow, .sarrow { position: absolute; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 30px solid var(--gold);
                      filter: drop-shadow(0 0 6px #FFB347); transform-origin: 50% 50%; }
    .sarrow { border-bottom-color: #7A3CFF; filter: drop-shadow(0 0 6px #7A3CFF); }
    body.cb .sarrow { border-bottom-color: #00B3FF; filter: drop-shadow(0 0 6px #00B3FF); }
    #toast { position: absolute; top: 3.8rem; left: 50%; transform: translateX(-50%); font-size: 1.05rem; color: var(--gold); text-shadow: 0 0 8px #000; }
    #windwarn { position: absolute; top: 5.8rem; left: 50%; transform: translateX(-50%); font-size: 1rem; color: #cfe3a0; }
    #fps { position: absolute; top: 4.6rem; right: .9rem; font-size: 1rem; opacity: .75; }
    #flash { position: fixed; inset: 0; background: #FFE9B0; opacity: 0; pointer-events: none; }
    #flash.go { animation: flash .35s ease-out; }
    @keyframes flash { from { opacity: .35; } to { opacity: 0; } }
    #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(14, 20, 48, .78); overflow: auto; }
    .card { background: var(--panel); border: 1px solid rgba(242,193,78,.5); border-radius: 16px; padding: 1.4rem 2rem; max-width: 34rem; width: calc(100% - 4rem); text-align: center; max-height: 92vh; overflow: auto; }
    .card h1 { color: var(--gold); margin: 0 0 .3rem; font-size: 2.1rem; }
    .card h2 { margin: .6rem 0 .6rem; font-weight: 500; opacity: .9; font-size: 1.25rem; }
    .card p { line-height: 1.5; }
    .card .quote { font-style: italic; border-left: 3px solid var(--gold); padding-left: .7rem; text-align: left; }
    .card button { display: block; width: 100%; margin: .55rem 0 0; padding: .55rem; font-size: 1rem; border-radius: 10px; cursor: pointer;
                   border: 1px solid var(--gold); background: #2a2140; color: var(--text); }
    .card button:hover, .card button:focus { background: #3b2e58; outline: 2px solid var(--gold); }
    .card button.key { display: inline-block; width: auto; min-width: 8rem; margin: 0; }
    .card label { display: flex; justify-content: space-between; gap: .7rem; margin: .55rem 0; align-items: center; text-align: left; }
    .card input[type=checkbox] { width: 1.3rem; height: 1.3rem; }
    .card input#n-name { font-size: 1.1rem; padding: .3rem; width: 11rem; }
    .card .score { font-size: 1.6rem; color: var(--gold); }
    .card table { width: 100%; border-collapse: collapse; font-size: 1rem; }
    .card td, .card th { padding: .25rem .35rem; border-bottom: 1px solid rgba(242,193,78,.25); }
    .card tr.me td { color: var(--gold); font-weight: 700; }
    .keys { font-size: 1rem; opacity: .85; margin-top: .9rem; }
  </style>
</head>
<body>
  <div id="hud" class="hidden">
    <div id="flames"></div>
    <div id="clock">04:00</div>
    <div id="topright"></div>
    <div id="toast"></div>
    <div id="windwarn" class="hidden">🍃 Gió sắp nổi…</div>
    <div id="subs" aria-live="polite"></div>
    <div id="prompt" class="hidden"></div>
    <div id="arrow" class="hidden"></div>
    <div id="spawnarrows"></div>
    <div id="carry"></div>
    <div id="bar"></div>
    <div id="cds">
      <div class="cd" id="cd-dash"><span>Lướt</span></div>
      <div class="cd" id="cd-pulse"><span>Tỏa</span></div>
    </div>
    <div id="fps"></div>
  </div>
  <div id="flash"></div>
  <div id="screen"></div>
  <script type="module" src="/src/web/main.ts"></script>
</body>
</html>
